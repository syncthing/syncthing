name: Build Infrastructure Images

on:
  push:
    branches:
      - infrastructure
      - infra-*

env:
  GO_VERSION: "~1.27.0"
  CGO_ENABLED: "1"
  BUILD_USER: docker
  BUILD_HOST: github.syncthing.net
  TAGS: "sqlite_omit_load_extension sqlite_dbstat netgo osusergo"
  EXTRA_LDFLAGS: "-linkmode=external -extldflags=-static"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker-syncthing:
    name: Build and push Docker images
    if: github.repository_owner == 'syncthing'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - stcrashreceiver
          - stdht
          - strelaypoolsrv
          - stupgrades
          - ursrv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        run: |
          go run build.go -tags "$TAGS" -goos linux -goarch amd64 -cc "zig cc -target x86_64-linux-musl" build ${{ matrix.pkg }}
          mv ${{ matrix.pkg }} ${{ matrix.pkg }}-linux-amd64
          go run build.go -tags "$TAGS" -goos linux -goarch arm64 -cc "zig cc -target aarch64-linux-musl" build ${{ matrix.pkg }}
          mv ${{ matrix.pkg }} ${{ matrix.pkg }}-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set Docker tags (all branches)
        run: |
          tags=ghcr.io/syncthing/infra/${{ matrix.pkg }}:${{ github.ref_name }}
          echo "TAGS=$tags" >> $GITHUB_ENV

      - name: Set Docker tags (latest)
        if: github.ref == 'refs/heads/infrastructure'
        run: |
          tags=docker.io/syncthing/${{ matrix.pkg }}:latest,ghcr.io/syncthing/infra/${{ matrix.pkg }}:latest,${{ env.TAGS }}
          echo "TAGS=$tags" >> $GITHUB_ENV

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.${{ matrix.pkg }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Cosign
        if: github.ref == 'refs/heads/infrastructure'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image
        if: github.ref == 'refs/heads/infrastructure'
        run: cosign sign --yes --recursive ghcr.io/syncthing/infra/${{ matrix.pkg }}:latest@${{ steps.build.outputs.digest }}